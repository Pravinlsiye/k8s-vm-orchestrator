apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: vmjob-controller-role
  labels:
    app: vmjob-controller
    component: rbac
rules:
  # CRD permissions (to verify CRDs exist)
  - apiGroups: ["apiextensions.k8s.io"]
    resources: ["customresourcedefinitions"]
    verbs: ["get", "list"]
    
  # VMJob permissions
  - apiGroups: ["orchestrator.vmjobs.io"]
    resources: ["vmjobs"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["orchestrator.vmjobs.io"]
    resources: ["vmjobs/status"]
    verbs: ["get", "update", "patch"]
  
  # VMNode permissions
  - apiGroups: ["orchestrator.vmjobs.io"]
    resources: ["vmnodes"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: ["orchestrator.vmjobs.io"]
    resources: ["vmnodes/status"]
    verbs: ["get", "update", "patch"]
  
  # ConfigMap permissions (for controller config)
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
  
  # Secret permissions (for WinRM credentials)
  - apiGroups: [""]
    resources: ["secrets"]
    verbs: ["get", "list", "watch"]
  
  # Event permissions (for recording events)
  - apiGroups: [""]
    resources: ["events"]
    verbs: ["create", "patch", "update"]
  
  # Pod permissions (if controller needs to check its own pod)
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]

