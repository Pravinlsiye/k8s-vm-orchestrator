apiVersion: v1
kind: ConfigMap
metadata:
  name: vmjob-controller-config
  namespace: default
  labels:
    app: vmjob-controller
data:
  controller.conf: |
    # VMJob Controller Configuration
    heartbeat_interval: 60
    job_timeout: 7200
    max_retries: 3
    log_level: INFO

---
# NOTE: Create this secret out-of-band, not in version control:
#   kubectl create secret generic vmjob-credentials \
#     --from-literal=username=<VM_ADMIN_USERNAME> \
#     --from-literal=password=<VM_ADMIN_PASSWORD>
# The deployment below references it via secretKeyRef.
apiVersion: v1
kind: Secret
metadata:
  name: vmjob-credentials
  namespace: default
  labels:
    app: vmjob-controller
type: Opaque
stringData:
  username: "REPLACE_ME"
  password: "REPLACE_ME"

---
apiVersion: v1
kind: Secret
metadata:
  name: azure-storage-credentials
  namespace: default
  labels:
    app: vmjob-controller
type: Opaque
stringData:
  account_name: ""  # Fill in after Terraform creates storage account
  account_key: ""   # Fill in after Terraform creates storage account
  container_name: "job-results"

---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmjob-controller
  namespace: default
  labels:
    app: vmjob-controller
    component: controller
spec:
  replicas: 1
  selector:
    matchLabels:
      app: vmjob-controller
  template:
    metadata:
      labels:
        app: vmjob-controller
        component: controller
    spec:
      serviceAccountName: vmjob-controller
      imagePullSecrets:
        - name: acr-secret
      containers:
        - name: controller
          image: <YOUR_ACR_NAME>.azurecr.io/vmjob-controller:latest
          imagePullPolicy: IfNotPresent
          env:
            - name: VM_ADMIN_USERNAME
              valueFrom:
                secretKeyRef:
                  name: vmjob-credentials
                  key: username
            - name: VM_ADMIN_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: vmjob-credentials
                  key: password
            - name: AZURE_STORAGE_ACCOUNT
              valueFrom:
                secretKeyRef:
                  name: azure-storage-credentials
                  key: account_name
                  optional: true
            - name: AZURE_STORAGE_KEY
              valueFrom:
                secretKeyRef:
                  name: azure-storage-credentials
                  key: account_key
                  optional: true
            - name: USE_PRIVATE_IPS
              value: "true"  # Using private IPs since AKS is in the same VNet
            - name: AZURE_STORAGE_CONTAINER
              valueFrom:
                secretKeyRef:
                  name: azure-storage-credentials
                  key: container_name
                  optional: true
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: LOG_LEVEL
              value: "Debug"
            - name: Logging__LogLevel__Default
              value: "Debug"
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
      restartPolicy: Always
      terminationGracePeriodSeconds: 30

---
apiVersion: v1
kind: Service
metadata:
  name: vmjob-controller
  namespace: default
  labels:
    app: vmjob-controller
spec:
  selector:
    app: vmjob-controller
  ports:
    - name: http
      port: 8080
      targetPort: 8080
      protocol: TCP
  type: ClusterIP

