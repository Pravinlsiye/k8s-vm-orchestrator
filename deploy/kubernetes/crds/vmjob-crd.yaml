apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: vmjobs.orchestrator.vmjobs.io
spec:
  group: orchestrator.vmjobs.io
  scope: Namespaced
  names:
    plural: vmjobs
    singular: vmjob
    kind: VMJob
    shortNames:
      - vmj
  versions:
    - name: v1
      served: true
      storage: true
      schema:
        openAPIV3Schema:
          type: object
          properties:
            spec:
              type: object
              required:
                - command
              properties:
                vmSelector:
                  type: object
                  description: "Selector to match VM nodes for job execution"
                  properties:
                    os:
                      type: string
                      description: "Operating system (e.g., windows, linux)"
                      default: "windows"
                    tags:
                      type: object
                      description: "Key-value tags to match VM capabilities"
                      additionalProperties:
                        type: string
                    nodeName:
                      type: string
                      description: "Specific VM node name to run on (optional)"
                command:
                  type: string
                  description: "Command to execute on the VM"
                args:
                  type: array
                  description: "Arguments for the command"
                  items:
                    type: string
                workingDir:
                  type: string
                  description: "Working directory for command execution"
                  default: "C:\\vmjob-results"
                timeout:
                  type: string
                  description: "Job timeout (e.g., 30m, 2h)"
                  default: "1h"
                retryPolicy:
                  type: object
                  description: "Retry policy for failed jobs"
                  properties:
                    maxRetries:
                      type: integer
                      description: "Maximum number of retries"
                      default: 3
                    backoffStrategy:
                      type: string
                      description: "Backoff strategy (fixed, exponential)"
                      enum: ["fixed", "exponential"]
                      default: "exponential"
                    initialBackoff:
                      type: string
                      description: "Initial backoff duration"
                      default: "10s"
                env:
                  type: array
                  description: "Environment variables"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                priority:
                  type: integer
                  description: "Job priority (higher = more important)"
                  default: 0
                  minimum: 0
                  maximum: 100
                executionMode:
                  type: string
                  description: "Execution mode: simple or stages"
                  enum: ["simple", "stages"]
                variables:
                  type: object
                  description: "Job variables for substitution"
                  x-kubernetes-preserve-unknown-fields: true
                environment:
                  type: array
                  description: "Job-level environment variables"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      value:
                        type: string
                stages:
                  type: array
                  description: "Stages for stage-based execution"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      displayName:
                        type: string
                      dependsOn:
                        type: array
                        items:
                          type: string
                      environment:
                        type: array
                        items:
                          type: object
                          properties:
                            name:
                              type: string
                            value:
                              type: string
                      steps:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                finally:
                  type: object
                  description: "Cleanup steps to run after all stages"
                  properties:
                    steps:
                      type: array
                      items:
                        type: object
                        x-kubernetes-preserve-unknown-fields: true
            status:
              type: object
              properties:
                phase:
                  type: string
                  description: "Current phase of the job"
                  enum:
                    - Pending
                    - Scheduled
                    - Running
                    - Completed
                    - Failed
                    - Cancelled
                assignedVM:
                  type: string
                  description: "VM node assigned to this job"
                startTime:
                  type: string
                  format: date-time
                  description: "Job start timestamp"
                completionTime:
                  type: string
                  format: date-time
                  description: "Job completion timestamp"
                exitCode:
                  type: integer
                  description: "Exit code of the job"
                logs:
                  type: string
                  description: "Job execution logs (stdout/stderr)"
                resultPath:
                  type: string
                  description: "Path to job results in storage"
                retries:
                  type: integer
                  description: "Number of retries attempted"
                  default: 0
                message:
                  type: string
                  description: "Human-readable message about job status"
                duration:
                  type: string
                  description: "Human-readable duration (e.g., 2h30m15s)"
                durationSeconds:
                  type: integer
                  description: "Duration in seconds"
                totalStages:
                  type: integer
                  description: "Total number of stages in the job"
                completedStages:
                  type: integer
                  description: "Number of completed stages"
                currentStage:
                  type: string
                  description: "Currently executing stage"
                currentTask:
                  type: string
                  description: "Currently executing task"
                stages:
                  type: array
                  description: "Status of individual stages"
                  items:
                    type: object
                    properties:
                      name:
                        type: string
                      status:
                        type: string
                      startTime:
                        type: string
                        format: date-time
                      endTime:
                        type: string
                        format: date-time
                      tasks:
                        type: array
                        items:
                          type: object
                          x-kubernetes-preserve-unknown-fields: true
                conditions:
                  type: array
                  description: "Detailed status conditions"
                  items:
                    type: object
                    properties:
                      type:
                        type: string
                      status:
                        type: string
                      lastTransitionTime:
                        type: string
                        format: date-time
                      reason:
                        type: string
                      message:
                        type: string
      subresources:
        status: {}
      additionalPrinterColumns:
        - name: Status
          type: string
          description: Current status of the job
          jsonPath: .status.phase
        - name: Assigned-VM
          type: string
          description: VM node running the job
          jsonPath: .status.assignedVM
        - name: Exit-Code
          type: integer
          description: Job exit code
          jsonPath: .status.exitCode
        - name: Duration
          type: string
          description: Job execution duration
          jsonPath: .status.duration
        - name: Age
          type: date
          jsonPath: .metadata.creationTimestamp

