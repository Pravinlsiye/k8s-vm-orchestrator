apiVersion: orchestrator.vmjobs.io/v1
kind: VMJob
metadata:
  name: single-line-test
  namespace: default
spec:
  vmSelector:
    os: windows
  command: powershell.exe
  args:
    - "-Command"
    - "New-Item -ItemType Directory -Path C:\\vmjob-results -Force | Out-Null; 'Test content from VMJob' | Out-File -FilePath C:\\vmjob-results\\test.txt; Write-Host 'File created successfully'; Get-Content C:\\vmjob-results\\test.txt"
  workingDir: "C:\\"
  timeout: "2m"
  priority: 100
